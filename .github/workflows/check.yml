name: check

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: check
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            state-

      - name: Run checks
        id: probe
        env:
          LIST_A: ${{ secrets.LIST_A }}
          LIST_B: ${{ secrets.LIST_B }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          PING: ${{ secrets.PING_URL }}
          QUIET: ${{ vars.QUIET_HOURS }}
        run: bash check.sh

      - name: Save state
        if: ${{ always() && steps.probe.outputs.changed == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .state
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
