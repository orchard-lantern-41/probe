name: keepalive

on:
  schedule:
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions: {}

jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Empty commit
        run: |
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit --allow-empty -m 'chore: keepalive'
          git push
